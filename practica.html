<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica - Normas de acentuación - Aprenem Junts</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contingut-detall {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-top: 8px solid #d4ed31;
            border-radius: 12px;
            padding: 40px;
            margin: 40px auto;
            max-width: 900px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            position: relative;
            text-align: center;
        }
        .contingut-detall h2 {
            color: #004d40;
            margin-top: 0;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .contingut-detall p {
            font-size: 1.15rem;
            color: #444444;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Estils modernitzats i colorits per a la ruleta */
        .ruleta-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            position: relative;
        }

        .ruleta-container {
            position: relative;
            width: 340px;
            height: 340px;
            margin: 0 auto;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.15));
        }

        /* Fletxa indicadora superior elegant */
        .ruleta-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 32px solid #ff5722;
            z-index: 20;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.2));
        }

        .ruleta-svg {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.12, 1);
        }

        /* Botó central decoratiu de la ruleta */
        .ruleta-center-pin {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #ffffff 0%, #e0e0e0 100%);
            border: 4px solid #ffffff;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #004d40;
            font-size: 14px;
        }

        .ruleta-botons-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
            align-items: center;
        }

        .boto-ruleta {
            padding: 14px 35px;
            background: linear-gradient(135deg, #ff7043 0%, #f4511e 100%);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(244, 81, 30, 0.4);
            transition: all 0.2s ease;
        }
        .boto-ruleta:hover {
            background: linear-gradient(135deg, #ff5722 0%, #e64a19 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(244, 81, 30, 0.5);
        }
        .boto-ruleta:active {
            transform: translateY(1px);
        }
        .boto-ruleta:disabled {
            background: #cccccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .boto-reset {
            padding: 14px 25px;
            background: linear-gradient(135deg, #78909c 0%, #546e7a 100%);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(84, 110, 122, 0.4);
            transition: all 0.2s ease;
        }
        .boto-reset:hover {
            background: linear-gradient(135deg, #607d8b 0%, #455a64 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(84, 110, 122, 0.5);
        }
        .boto-reset:active {
            transform: translateY(1px);
        }

        #resultat-ruleta {
            margin-top: 20px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #004d40;
            min-height: 40px;
            padding: 10px 20px;
            background: #e0f2f1;
            border-radius: 8px;
            display: inline-block;
            border: 1px solid #b2dfdb;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.3s ease;
        }
        #resultat-ruleta.visible {
            opacity: 1;
            transform: scale(1);
        }

        @media (min-width: 1200px) {
            .content-container {
                padding: 0 150px;
            }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="header-avatar">
                <img src="avatar.png" alt="Mestre Aprenem Junts">
            </div>
            <div class="header-banner">
                <img src="banner.png" alt="Bàner Classes Virtuals per l'Alumnat d'Educació Primària">
            </div>
        </div>
    </header>

   <nav class="main-nav">
    <ul>
        <li><a href="index.html" class="nav-link">Presentació</a></li>
        <li><a href="Cicles.html" class="nav-link">Cicles</a></li>
        <li><a href="Curs.html" class="nav-link">Cicle Mitjà</a></li>
        <li><a href="arees4t.html" class="nav-link">Àrees</a></li>
        <li><a href="ortografiagramatica.html" class="nav-link">Branques</a></li>
        <li><a href="normasacentuacion.html" class="nav-link">Normes</a></li>
        <li><a href="practica.html" class="nav-link" style="background-color: #d4ed31; color: #000000;">Pràctica</a></li>
    </ul>
</nav>

    <main class="content-container">
        <section class="contingut-detall">
            <h2>Práctica de acentuación</h2>
           
            <!-- Ruleta de 5 panells colorida -->
            <div class="ruleta-wrapper">
                <div class="ruleta-container">
                    <div class="ruleta-pointer"></div>
                    <div class="ruleta-center-pin">★</div>
                    <svg class="ruleta-svg" id="ruletaSvg" viewBox="0 0 300 300">
                        <defs>
                            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                                <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
                            </filter>
                        </defs>
                        <!-- Sector 1: Rosa/Magenta viu -->
                        <path id="sector-0" d="M150,150 L150,10 A140,140 0 0,1 283.3,106.8 Z" fill="#E91E63" stroke="#ffffff" stroke-width="3"/>
                        <text x="220" y="75" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle" transform="rotate(36, 220, 75)" filter="url(#shadow)">Actividad 1</text>

                        <!-- Sector 2: Lila elegant -->
                        <path id="sector-1" d="M150,150 L283.3,106.8 A140,140 0 0,1 233.3,263.2 Z" fill="#9C27B0" stroke="#ffffff" stroke-width="3"/>
                        <text x="245" y="195" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle" transform="rotate(108, 245, 195)" filter="url(#shadow)">Actividad 2</text>

                        <!-- Sector 3: Blau radiant -->
                        <path id="sector-2" d="M150,150 L233.3,263.2 A140,140 0 0,1 66.7,263.2 Z" fill="#2196F3" stroke="#ffffff" stroke-width="3"/>
                        <text x="150" y="245" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle" transform="rotate(180, 150, 245)" filter="url(#shadow)">Actividad 3</text>

                        <!-- Sector 4: Verd blavós fosc / menta intens -->
                        <path id="sector-3" d="M150,150 L66.7,263.2 A140,140 0 0,1 16.7,106.8 Z" fill="#009688" stroke="#ffffff" stroke-width="3"/>
                        <text x="55" y="195" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle" transform="rotate(252, 55, 195)" filter="url(#shadow)">Actividad 4</text>

                        <!-- Sector 5: Taronja càlid -->
                        <path id="sector-4" d="M150,150 L16.7,106.8 A140,140 0 0,1 150,10 Z" fill="#FF9800" stroke="#ffffff" stroke-width="3"/>
                        <text x="80" y="75" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle" transform="rotate(324, 80, 75)" filter="url(#shadow)">Actividad 5</text>
                    </svg>
                </div>

                <div class="ruleta-botons-container">
                    <button class="boto-ruleta" id="girarBoto">Gira la ruleta</button>
                    <button class="boto-reset" id="resetBoto">Resetear</button>
                </div>
                <div id="resultat-ruleta"></div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Aprenem Junts - Classes Virtuals d'Educació Primària. Tots els drets reservats.</p>
    </footer>

    <script>
        const girarBoto = document.getElementById('girarBoto');
        const resetBoto = document.getElementById('resetBoto');
        const ruleta = document.getElementById('ruletaSvg');
        const resultatRuleta = document.getElementById('resultat-ruleta');
        
        const totalPanells = 5;
        const grausPerPanell = 360 / totalPanells;
        const activitats = ["Actividad 1", "Actividad 2", "Actividad 3", "Actividad 4", "Actividad 5"];
        const colorsOriginals = ["#E91E63", "#9C27B0", "#2196F3", "#009688", "#FF9800"];

        // Carregar l'estat guardat prèviament del navegador (si existeix)
        let grauActual = parseInt(localStorage.getItem('ruleta_grauActual')) || 0;
        let panellsPendents = JSON.parse(localStorage.getItem('ruleta_pendents')) || [0, 1, 2, 3, 4];
        let sectorsComplets = JSON.parse(localStorage.getItem('ruleta_sectorsComplets')) || [];
        let estatFinalitzat = JSON.parse(localStorage.getItem('ruleta_finalitzat')) || false;
        let ultimMissatge = localStorage.getItem('ruleta_missatge') || "";

        // Aplicar immediatament la rotació i colors guardats en carregar la pàgina
        ruleta.style.transform = `rotate(${grauActual}deg)`;
        sectorsComplets.forEach(index => {
            const sectorElement = document.getElementById(`sector-${index}`);
            if (sectorElement) {
                sectorElement.setAttribute('fill', '#cfd8dc');
            }
        });

        if (estatFinalitzat) {
            girarBoto.disabled = true;
            girarBoto.textContent = "Completat";
            girarBoto.style.background = "#9e9e9e";
            girarBoto.style.cursor = "default";
        }

        if (ultimMissatge) {
            resultatRuleta.textContent = ultimMissatge;
            resultatRuleta.classList.add('visible');
        }

        // Funció per desar l'estat actual al localStorage
        function guardarEstat() {
            localStorage.setItem('ruleta_grauActual', grauActual);
            localStorage.setItem('ruleta_pendents', JSON.stringify(panellsPendents));
            localStorage.setItem('ruleta_sectorsComplets', JSON.stringify(sectorsComplets));
            localStorage.setItem('ruleta_finalitzat', JSON.stringify(estatFinalitzat));
            localStorage.setItem('ruleta_missatge', resultatRuleta.textContent);
        }

        girarBoto.addEventListener('click', () => {
            if (panellsPendents.length === 0 || estatFinalitzat) return;

            girarBoto.disabled = true;
            resetBoto.disabled = true;
            resultatRuleta.classList.remove('visible');
            resultatRuleta.textContent = "¡Suerte!";
            setTimeout(() => resultatRuleta.classList.add('visible'), 50);

            const indexAleatori = Math.floor(Math.random() * panellsPendents.length);
            const panellGuanyador = panellsPendents[indexAleatori];

            // Treure de pendents i afegir a sectors complets
            panellsPendents.splice(indexAleatori, 1);
            sectorsComplets.push(panellGuanyador);

            const voltesExtra = Math.floor(Math.random() * 5) + 5;
            const angleSector = (panellGuanyador * grausPerPanell) + (grausPerPanell / 2);
            const angleObjectiu = (voltesExtra * 360) + (360 - angleSector);
            grauActual += angleObjectiu - (grauActual % 360);

            ruleta.style.transform = `rotate(${grauActual}deg)`;

            setTimeout(() => {
                const activitatTrobada = activitats[panellGuanyador];
                
                const sectorElement = document.getElementById(`sector-${panellGuanyador}`);
                if (sectorElement) {
                    sectorElement.setAttribute('fill', '#cfd8dc');
                }

                resetBoto.disabled = false;

                if (panellsPendents.length > 0) {
                    girarBoto.disabled = false;
                    resultatRuleta.textContent = ` ${activitatTrobada}!`;
                } else {
                    estatFinalitzat = true;
                   
                    girarBoto.textContent = "Completado";
                    girarBoto.style.background = "#9e9e9e";
                    girarBoto.style.cursor = "default";
                    girarBoto.disabled = true;
                }

                // Guardar dades de manera persistent
                guardarEstat();

                // Obre automàticament l'activitat corresponent en pestanya nova
                if (activitatTrobada === "Actividad 1") {
                    setTimeout(() => {
                        window.open('actividad1.html', '_blank');
                    }, 1000);
                } else if (activitatTrobada === "Actividad 2") {
                    setTimeout(() => {
                        window.open('actividad2.html', '_blank');
                    }, 1000);
                } else if (activitatTrobada === "Actividad 3") {
                    setTimeout(() => {
                        window.open('actividad3.html', '_blank');
                    }, 1000);
                } else if (activitatTrobada === "Actividad 4") {
                    setTimeout(() => {
                        window.open('actividad4.html', '_blank');
                    }, 1000);
                } else if (activitatTrobada === "Actividad 5") {
                    setTimeout(() => {
                        window.open('actividad5.html', '_blank');
                    }, 1000);
                }

            }, 4100);
        });

        // Botó Resetear per netejar la memòria persistent
        resetBoto.addEventListener('click', () => {
            panellsPendents = [0, 1, 2, 3, 4];
            sectorsComplets = [];
            estatFinalitzat = false;
            
            // Netejar localStorage
            localStorage.removeItem('ruleta_grauActual');
            localStorage.removeItem('ruleta_pendents');
            localStorage.removeItem('ruleta_sectorsComplets');
            localStorage.removeItem('ruleta_finalitzat');
            localStorage.removeItem('ruleta_missatge');
            
            // Restaura els colors originals de tots els sectors
            for (let i = 0; i < totalPanells; i++) {
                const sectorElement = document.getElementById(`sector-${i}`);
                if (sectorElement) {
                    sectorElement.setAttribute('fill', colorsOriginals[i]);
                }
            }

            // Restaura l'estat inicial del botó de girar
            girarBoto.disabled = false;
            girarBoto.textContent = "Gira la ruleta";
            girarBoto.style.background = "linear-gradient(135deg, #ff7043 0%, #f4511e 100%)";
            girarBoto.style.cursor = "pointer";

            // Neteja el missatge de resultat
            resultatRuleta.classList.remove('visible');
            resultatRuleta.textContent = "";
        });
    </script>
</body>
</html>
