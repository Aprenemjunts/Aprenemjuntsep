<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cicles - Aprenem Junts</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estils específics per a les caixes de cicles */
        .cicles-nav {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 30px 0 0 0;
            justify-content: space-between;
            gap: 20px;
        }
        .cicles-nav li {
            flex: 1;
            display: flex;
            text-align: center;
        }
        .cicles-nav a {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 20px;
            color: #333;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.25rem;
            font-weight: bold;
            border: 2px solid transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        /* Cicle Inicial: Blau cel */
        .cicles-nav li:nth-child(1) a {
            background-color: #87CEEB;
        }

        /* Cicle Mitjà: Groc */
        .cicles-nav li:nth-child(2) a {
            background-color: #FFD700;
        }

        /* Cicle Superior: Vermell clar */
        .cicles-nav li:nth-child(3) a {
            background-color: #FFB6C1;
        }

        /* Efecte quan s'assenyala amb el ratolí */
        .cicles-nav a:hover {
            border-color: #0056b3;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            transform: translateY(-2px);
            filter: brightness(0.95);
        }

        .cicles-nav a.active {
            filter: brightness(1);
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="header-avatar">
                <img src="avatar.png" alt="Mestre Aprenem Junts">
            </div>
            <div class="header-banner">
                <img src="banner.png" alt="Bàner Classes Virtuals per l'Alumnat d'Educació Primària">
            </div>
        </div>
    </header>

    <nav class="main-nav">
        <ul>
            <li><a href="index.html" class="nav-link">Presentació</a></li>
            <li><a href="Cicles.html" class="nav-link active">Cicles</a></li>
            
        </ul>
    </nav>

    <main class="content-container">
        <section class="welcome-section">
            
            <ul class="cicles-nav">
                <li><a href="#cicle-inicial" class="cicle-link">Cicle Inicial (Procès de construcció)</a></li>
                <li><a href="Curs.html" class="cicle-link">Cicle Mitjà</a></li>
                <li><a href="#cicle-superior" class="cicle-link">Cicle Superior (Procès de construcció)</a></li>
            </ul>

        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Aprenem Junts - Classes Virtuals d'Educació Primària. Tots els drets reservats.</p>
    </footer>

</body>
</html>
