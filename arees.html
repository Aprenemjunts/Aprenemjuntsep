<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Àrees - Aprenem Junts</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estils per aconseguir el format de les targetes de les àrees */
        .content-section {
            display: flex;
            gap: 20px;
            justify-content: center;
            padding: 40px 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 25px 20px;
            cursor: pointer;
            width: 45%;
            max-width: 500px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: #d4e157;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        .card h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #004d40;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="header-avatar">
                <img src="avatar.png" alt="Mestre Aprenem Junts">
            </div>
            <div class="header-banner">
                <img src="banner.png" alt="Bàner Classes Virtuals per l'Alumnat d'Educació Primària">
            </div>
        </div>
    </header>

    <nav class="main-nav">
        <ul>
            <li><a href="index.html" class="nav-link">Presentació</a></li>
            <li><a href="Cicles.html" class="nav-link">Cicles</a></li>
            <li><a href="Curs.html" class="nav-link">Curs</a></li>
            <li><a href="arees.html" class="nav-link active">Àrees</a></li>
        </ul>
    </nav>

    <main class="content-section">
        <div class="card" onclick="location.href='unitats.html'">
            <h2>Coneixement del Medi Natural, Social i Cultural</h2>
        </div>
        <div class="card" onclick="location.href='matematiques.html'">
            <h2>Matemàtiques</h2>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Aprenem Junts - Classes Virtuals d'Educació Primària. Tots els drets reservats.</p>
    </footer>

</body>
</html>
